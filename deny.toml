# cargo-deny policy (NFR-14): permissive licences only, no crates with security advisories,
# crates.io only. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
yanked = "deny"
ignore = []

[licenses]
# NFR-14: MIT, Apache-2.0, BSD, ISC, Zlib or Unicode-3.0.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# The allow list is the policy; not every licence has to be in use.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Unpublished workspace crates (hardless-wasm, xtask) are covered by the workspace licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
