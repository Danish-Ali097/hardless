name: Docker

# NFR-09 and NFR-12: build the hardless/hardless image for linux/amd64 and linux/arm64 and
# check it serves a working dashboard (M2 acceptance). Nothing is pushed until the first
# release (v0.1.0).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  binary:
    name: Static binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Embedded in the binary at build time.
      - run: pnpm --filter @hardless/dashboard build
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p hardless-cli --target ${{ matrix.target }}
      - name: Binary size (NFR-09, under 25 MB)
        run: |
          size=$(stat -c %s target/${{ matrix.target }}/release/hardless)
          echo "hardless is $((size / 1024)) KiB"
          test "$size" -lt $((25 * 1024 * 1024))
      - uses: actions/upload-artifact@v4
        with:
          name: hardless-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/hardless
          if-no-files-found: error

  image:
    name: Image (linux/amd64, linux/arm64)
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: hardless-amd64
          path: docker/bin/amd64
      - uses: actions/download-artifact@v4
        with:
          name: hardless-arm64
          path: docker/bin/arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build for both platforms (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: hardless/hardless:ci
      - name: Load the amd64 image to test it
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hardless/hardless:test
      - name: Image size (NFR-09, under 40 MB)
        run: |
          size=$(docker image inspect hardless/hardless:test --format '{{.Size}}')
          echo "the image is $((size / 1024)) KiB"
          test "$size" -lt $((40 * 1024 * 1024))
      - name: docker run serves a working dashboard (M2 acceptance)
        run: |
          docker run -d --name hardless -p 8080:8080 -p 8443:8443 hardless/hardless:test
          for i in $(seq 1 100); do curl -fsS http://127.0.0.1:8080/api/v1/health && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/v1/info | grep -q '"enabled":true'
          curl -fsS http://127.0.0.1:8080/hardless-ca.crt -o hardless-ca.crt
          curl -fsS --cacert hardless-ca.crt https://localhost:8443/api/v1/health
          curl -fsS -X POST -H 'Content-Type: text/xml' \
            --data '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print"><text>docker</text></epos-print>' \
            'http://127.0.0.1:8080/cgi-bin/epos/service.cgi?devid=local_printer' | grep -q 'success="true"'
          curl -fsS http://127.0.0.1:8080/api/v1/devices/local_printer/jobs/last | grep -q 'docker'
      - name: Server output
        if: always()
        run: docker logs hardless || true
