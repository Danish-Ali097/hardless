name: Publish Docker image

# Called by release.yml (cargo-dist publish job) when a version tag is pushed: packs the
# release's own static musl binaries into hardless/hardless for linux/amd64 and linux/arm64
# (NFR-12), checks the image starts, and pushes it to Docker Hub as <version>,
# <major>.<minor> and latest. Needs the DOCKERHUB_TOKEN secret and the DOCKERHUB_USERNAME
# variable (a secret of that name works too).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  docker:
    name: Docker Hub
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: Download the release archives
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: release
          merge-multiple: true
      - name: Unpack the static binaries
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; cpu=${pair##*:}
            mkdir -p docker/bin/$arch
            tar -xzf release/hardless-cli-$cpu-unknown-linux-musl.tar.gz -C docker/bin/$arch --strip-components=1 --wildcards '*/hardless'
            file docker/bin/$arch/hardless
          done
      - name: Tags
        id: tags
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          version=$(echo "$PLAN" | jq -r .announcement_tag | sed 's/^v//')
          echo "list=hardless/hardless:$version,hardless/hardless:${version%.*},hardless/hardless:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Load the amd64 image to test it
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hardless/hardless:test
      - name: The image serves the dashboard and API
        run: |
          docker run -d --name hardless -p 8080:8080 hardless/hardless:test
          for i in $(seq 1 100); do curl -fsS http://127.0.0.1:8080/api/v1/health && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker run --rm hardless/hardless:test licenses | grep -q "Part 3: The dashboard"
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push both platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
