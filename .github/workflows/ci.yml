name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Engine crates must stay sans-IO and build for the browser (PRD section 6).
  WASM_CRATES: >-
    -p hardless-core -p hardless-escpos -p hardless-render -p hardless-devices
    -p hardless-http-dialects -p hardless-wasm

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain, components and wasm target pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: wasm32 build of engine crates
        shell: bash
        run: cargo build --target wasm32-unknown-unknown $WASM_CRATES
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: engine tests in WebAssembly (FR-15)
        run: cargo test -p hardless-wasm --target wasm32-unknown-unknown
      - name: packages/types is up to date
        run: cargo xtask gen-types --check
      - name: docs/reference and llms.txt are up to date (FR-46, FR-51)
        run: cargo xtask docs --check
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.97 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.97 check --workspace --all-targets --all-features
      - run: cargo +1.97 check --target wasm32-unknown-unknown $WASM_CRATES

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  notices:
    name: Licence notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Its notices are part of the file.
      - run: pnpm --filter @hardless/dashboard build
      # cargo-about runs offline (--frozen); fetch every platform's crates first.
      - run: cargo fetch --locked
      - name: The binary's and the shim's THIRD_PARTY_LICENSES.txt are up to date (NFR-14)
        run: cargo xtask licenses --check

  # Everything the v0.1.0 release publishes, packed and checked without publishing:
  # crates.io (cargo publish --dry-run), npm (pack-npm.mjs, npm publish --dry-run) and the
  # extension zip. The binaries are built by release.yml on pull requests (cargo-dist).
  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every crate and package carries the LICENSE
        run: for f in crates/hardless-*/LICENSE packages/{types,shim-web,playwright,npm-wrapper}/LICENSE; do cmp LICENSE "$f"; done
      - name: cargo publish --dry-run (with the dashboard in the server crate)
        run: |
          pnpm --filter @hardless/dashboard build
          cp -r packages/dashboard/dist crates/hardless-server/dashboard
          cargo publish --workspace --dry-run --locked --allow-dirty
      - name: Pack the npm packages
        run: |
          cargo xtask build-wasm
          pnpm -r build
          node scripts/pack-npm.mjs --out npm-packs
      # npm refuses even a dry run for a version it already has, which is every package on
      # main between a release and the next version bump; those are only packed and checked.
      - name: npm publish --dry-run
        run: |
          npm install -g npm@11.21.0
          for pack in $(cat npm-packs/order.txt); do
            spec=$(tar -xzOf "npm-packs/$pack" package/package.json | jq -r '"\(.name)@\(.version)"')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npm; packed and checked only"
            else
              npm publish "./npm-packs/$pack" --dry-run --access public
            fi
          done
      - name: Extension zip
        run: node scripts/zip-extension.mjs --no-build

  browser:
    name: Browser packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: format
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm -r test
      - name: build
        run: pnpm build
      - name: npm licences (NFR-14)
        run: pnpm run check:licenses

  e2e:
    name: Browser tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the dashboard, server and standalone engine
        run: |
          pnpm --filter @hardless/dashboard build
          cargo build -p hardless-cli
          cargo xtask build-wasm
          pnpm --filter @hardless/shim-web build
          pnpm --filter @hardless/extension build
      - run: pnpm --filter @hardless/shim-web exec playwright install --with-deps chromium webkit
      - name: Web Serial shim conformance (PRD section 8.1)
        run: pnpm --filter @hardless/shim-web test:browser
      - name: M1, M2 and M3 acceptance (example app, server, dashboard, fixture; Chromium and WebKit)
        run: pnpm --filter @hardless/example-react-pwa test:acceptance
      - name: Chrome extension (FR-17, NFR-03)
        run: pnpm --filter @hardless/extension test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            packages/shim-web/test-results
            examples/react-pwa/test-results
            packages/extension/test-results
