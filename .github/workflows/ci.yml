name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Engine crates must stay sans-IO and build for the browser (PRD section 6).
  WASM_CRATES: >-
    -p hardless-core -p hardless-escpos -p hardless-render -p hardless-devices
    -p hardless-http-dialects -p hardless-wasm

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain, components and wasm target pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: wasm32 build of engine crates
        shell: bash
        run: cargo build --target wasm32-unknown-unknown $WASM_CRATES
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: engine tests in WebAssembly (FR-15)
        run: cargo test -p hardless-wasm --target wasm32-unknown-unknown
      - name: packages/types is up to date
        run: cargo xtask gen-types --check
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.97 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.97 check --workspace --all-targets --all-features
      - run: cargo +1.97 check --target wasm32-unknown-unknown $WASM_CRATES

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  browser:
    name: Browser packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: format
        run: pnpm format:check
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm -r test
      - name: build
        run: pnpm build
      - name: npm licences (NFR-14)
        run: pnpm run check:licenses

  e2e:
    name: Browser tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build the dashboard, server and standalone engine
        run: |
          pnpm --filter @hardless/dashboard build
          cargo build -p hardless-cli
          cargo xtask build-wasm
          pnpm --filter @hardless/shim-web build
      - run: pnpm --filter @hardless/shim-web exec playwright install --with-deps chromium webkit
      - name: Web Serial shim conformance (PRD section 8.1)
        run: pnpm --filter @hardless/shim-web test:browser
      - name: M1 and M2 acceptance (example app, server and dashboard; Chromium and WebKit)
        run: pnpm --filter @hardless/example-react-pwa test:acceptance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            packages/shim-web/test-results
            examples/react-pwa/test-results
