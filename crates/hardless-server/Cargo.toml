[package]
name = "hardless-server"
description = "Hardless server: WebSocket bridge, HTTP printer endpoints, REST API and dashboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hardless-core.workspace = true
hardless-devices.workspace = true
hardless-escpos.workspace = true
hardless-http-dialects.workspace = true
hardless-mcp.workspace = true
hardless-render = { workspace = true, features = ["png"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "http1", "service", "tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
