[package]
name = "hardless-escpos"
description = "Streaming ESC/POS parser for Hardless: byte stream to command AST (sans-IO)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["escpos", "receipt", "printer", "parser", "pos"]
categories = ["parser-implementations", "emulators"]

[features]
default = []
# Derive TypeScript bindings with ts-rs. Used by `cargo xtask gen-types`.
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"], optional = true }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
serde_json = "1.0.154"

[lints]
workspace = true
