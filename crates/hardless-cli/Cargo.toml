[package]
name = "hardless-cli"
description = "The hardless binary: start the server, scan, tap, toggle faults, read receipts, run the MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "hardless"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
hardless-mcp.workspace = true
hardless-server.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
hardless-core.workspace = true
hardless-server.workspace = true
rmcp = { version = "3.6.0", default-features = false, features = ["client", "transport-child-process"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "time"] }

[lints]
workspace = true
