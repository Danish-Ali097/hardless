[package]
name = "hardless-render"
description = "Receipt renderer for Hardless: command AST to HTML, SVG and PNG."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
barcoders = { version = "2.0.0", default-features = false }
hardless-escpos.workspace = true
qrcode = { version = "0.14.1", default-features = false }
resvg = { version = "0.48.1", default-features = false, features = ["text"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }

[features]
# PNG output (FR-11) with resvg and the bundled Go Mono font. Off by default so the engine
# stays small for WebAssembly.
png = ["dep:resvg"]

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
serde_json = "1.0.154"
