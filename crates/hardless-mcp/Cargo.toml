[package]
name = "hardless-mcp"
description = "MCP server for Hardless so AI coding agents can drive emulated POS devices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
hardless-core.workspace = true
hardless-devices.workspace = true
hardless-escpos.workspace = true
hardless-http-dialects.workspace = true
hardless-render = { workspace = true, features = ["png"] }
rmcp = { version = "3.6.0", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["time", "io-std"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
