<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hardless</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #1f2328;
        --muted: #59636e;
        --line: #d1d9e0;
        --accent: #0969da;
        --on: #1a7f37;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #212830;
          --ink: #f0f6fc;
          --muted: #9198a1;
          --line: #3d444d;
          --accent: #4493f8;
          --on: #3fb950;
        }
      }
      body {
        margin: 0;
        width: 20rem;
        padding: 14px 16px 16px;
        background: var(--bg);
        color: var(--ink);
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
      }
      p {
        margin: 0 0 10px;
        color: var(--muted);
      }
      #origin {
        color: var(--ink);
        font-family: ui-monospace, monospace;
        word-break: break-all;
      }
      #status[data-on="true"] {
        color: var(--on);
        font-weight: 600;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 3px;
        padding: 5px 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        font: inherit;
      }
      button {
        padding: 6px 14px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button[data-kind="off"] {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      #message {
        min-height: 1em;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>Hardless</h1>
    <p>Site: <span id="origin">…</span></p>
    <p id="status" role="status">Checking…</p>
    <form id="form">
      <label>
        Hardless server bridge
        <input id="url" spellcheck="false" autocomplete="off" />
      </label>
      <label>
        Token (only if the server has one)
        <input id="token" type="password" autocomplete="off" />
      </label>
      <div class="actions">
        <button id="enable" type="submit">Use Hardless on this site</button>
        <button id="disable" type="button" data-kind="off" hidden>Turn off</button>
      </div>
    </form>
    <p id="message" role="alert"></p>
    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
