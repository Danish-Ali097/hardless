# release-plz: crate versions and changelogs from Conventional Commits.
# See https://release-plz.dev/docs/config
#
# Releases are published by .github/workflows/release.yml (cargo-dist) when a vX.Y.Z tag is
# pushed (RELEASING.md): it builds the binaries, creates the GitHub Release and publishes
# the crates. So release-plz only updates versions and changelogs (`release-plz update`) and
# never publishes, tags or creates releases itself.
[workspace]
changelog_update = true
publish = false
git_tag_enable = false
git_release_enable = false
semver_check = true
pr_labels = ["release"]

[[package]]
name = "xtask"
release = false
changelog_update = false

[[package]]
name = "hardless-wasm"
publish = false
